# checks-from-main: main's checks judge a pull request that changes a check's workflow.
# ci, jev and review run on `pull_request` with the PR's own workflow files, so a PR could edit a check to
# pass. This runs on `pull_request_target` (always main's copy). When the PR changes a gate file
# (.github/workflows/, .github/actions/, .jev/, .githooks/), main's ci tests the PR head (ci.yml) and main's second reviewer reads it.
# Required check `checks-from-main` (checks-before-main ruleset). Skipped, which counts as a pass, when no
# gate file changed. A fork's code never runs here.
# Generated by nuey-skills scripts/repo-standard/checks_from_main.py; do not edit here, re-run it.
name: checks-from-main

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["main"]

permissions: {}

concurrency:
  group: checks-from-main-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      gates_changed: ${{ steps.decide.outputs.gates_changed }}
    steps:
      - name: Does the PR change a gate file?
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          GATES: ".github/workflows/ .github/actions/ .jev/ .githooks/"
        run: |
          set -euo pipefail
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" --jq '.[] | .filename, (.previous_filename // empty)')
          changed=false
          while IFS= read -r f; do
            for g in $GATES; do
              case "$f" in "$g"*) changed=true; echo "Gate file changed: $f" | tee -a "$GITHUB_STEP_SUMMARY" ;; esac
            done
          done <<< "$files"
          echo "gates_changed=$changed" >> "$GITHUB_OUTPUT"

  # Main's ci.yml (a local reusable workflow resolves from the base branch here) on the PR head.
  # No `secrets:` line, so it gets none.
  main-ci:
    needs: scope
    if: ${{ needs.scope.outputs.gates_changed == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      pr_ref: ${{ github.event.pull_request.head.sha }}

  # Main's second reviewer. It checks out main and reads the PR as git data, never running it.
  main-review:
    needs: scope
    if: ${{ needs.scope.outputs.gates_changed == 'true' }}
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/review.yml
    secrets: inherit

  checks-from-main:
    needs: [scope, main-ci, main-review]
    if: ${{ !cancelled() && !(needs.scope.result == 'success' && needs.scope.outputs.gates_changed == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Result
        env:
          SCOPE: ${{ needs.scope.result }}
          GATES_CHANGED: ${{ needs.scope.outputs.gates_changed }}
          CI: ${{ needs.main-ci.result }}
          REVIEW: ${{ needs.main-review.result }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          fail=0
          say() { echo "$1"; echo "- $1" >> "$GITHUB_STEP_SUMMARY"; }
          echo "### checks-from-main" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SCOPE" != success ] || [ "$GATES_CHANGED" != true ]; then
            say "Could not tell whether the PR changes a gate file (scope: '$SCOPE')."; exit 1
          fi
          if [ "$CI" = none ]; then
            say "This repository's tests workflow is not callable, so main's ci did not run; main's review judges the change."
          elif [ "$SAME_REPO" != true ]; then
            say "The PR comes from a fork and changes a gate file; main's ci never runs a fork's code."; fail=1
          elif [ "$CI" = success ]; then
            say "Main's ci on the PR head: pass."
          else
            say "Main's ci on the PR head: '$CI'. The PR's own ci may pass only because the PR changed it."; fail=1
          fi
          if [ "$REVIEW" = success ]; then say "Main's second review: pass."
          else say "Main's second review: '$REVIEW'."; fail=1; fi
          exit $fail
