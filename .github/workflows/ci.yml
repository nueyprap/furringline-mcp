# ci: setup, checks and tests for every pull request and every push to the default branch
# (with main_green, main-green.yml runs it on the default branch and skips what is already tested).
# Generated by nuey-skills scripts/repo-standard/ci_workflow.py from
# scripts/night-shift/configs/furringline-mcp.toml; do not edit here, change the config and re-run.
# Required check `ci` under the checks-before-main ruleset.
name: ci

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:
  workflow_call:
    inputs:
      main_green:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}${{ inputs.main_green && format('-main-green-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    if: >-
      github.event_name != 'push' || github.event.head_commit.tree_id == '' ||
      !contains(join(github.event.commits.*.tree_id, ','), format('{0},{0}', github.event.head_commit.tree_id))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NO_COLOR: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Docs-only change?
        id: docs
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          only=false
          if [ "$GITHUB_EVENT_NAME" = pull_request ] || [ "$GITHUB_EVENT_NAME" = push ]; then
            if git rev-parse -q --verify HEAD^2 >/dev/null; then from=HEAD^1
            elif [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE" 2>/dev/null; then from=$BEFORE
            else from=""; fi
            if [ -n "$from" ] && files=$(git diff --name-only "$from" HEAD) && [ -n "$files" ]; then
              only=true
              while IFS= read -r f; do
                case "$f" in *.md|docs/*|lessons/*) ;; *) only=false; break ;; esac
              done <<< "$files"
            fi
          fi
          echo "only=$only" >> "$GITHUB_OUTPUT"
          if [ "$only" = true ]; then echo "Only docs changed: setup, checks and tests skipped." | tee -a "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/setup-python@v5
        if: steps.docs.outputs.only != 'true'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: steps.docs.outputs.only != 'true'
        with:
          node-version: 22
      - run: corepack enable
        if: steps.docs.outputs.only != 'true'
      - name: "Check 1: for f in $(git ls-files '*.json'); do python3 -m json.tool \"$f\" >/dev/"
        if: steps.docs.outputs.only != 'true'
        shell: bash
        run: "for f in $(git ls-files '*.json'); do python3 -m json.tool \"$f\" >/dev/null || { echo \"bad JSON: $f\"; exit 1; }; done"
